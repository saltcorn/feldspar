[package]
name = "sc-test-harness"
description = "Shared integration-test harness: a fresh, reset-per-test Postgres database"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sc-error.workspace = true
# `feldspar.toml`: the harness reads its `test` environment, so a developer whose
# Postgres is not the one CI runs needs no environment variables to `cargo test`.
sc-config-file.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
uuid.workspace = true
# `TestServer` (the `catalog` feature): a database with a catalog over it, torn
# down with the database. Optional, so a crate below the catalog that only
# needs a database does not build one.
sc-catalog = { workspace = true, optional = true }
sc-db = { workspace = true, optional = true }
sc-db-postgres = { workspace = true, optional = true }

[dev-dependencies]
# `workspace_invariants`: the manifests, `clippy.toml` and `deny.toml` read as
# data, so the lint policy is asserted on what the files say.
toml.workspace = true

[features]
catalog = ["dep:sc-catalog", "dep:sc-db", "dep:sc-db-postgres"]

[lints]
workspace = true
