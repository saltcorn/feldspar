# Saltcorn Feldspar and its PostgreSQL, as README §2.9 describes.
#
#   cp deploy/docker/env.example deploy/docker/.env    # then edit it
#   docker compose -f deploy/docker/compose.yml up -d
#
# Feldspar listens on plain HTTP, port 8080. Put the TLS-terminating proxy of
# your choice in front of it, sending the base domain *and* every subdomain of it
# (`*.example.com`) here: each application is served on a subdomain of its own.

name: feldspar

services:
  feldspar:
    build: .
    image: feldspar
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Arguments to `feldspar serve`. The base domain is what makes applications
    # reachable (at <subdomain>.<base domain>); without one only the admin UI is
    # served.
    command: ["--base-domain", "${FELDSPAR_BASE_DOMAIN:?set FELDSPAR_BASE_DOMAIN in .env}"]
    environment:
      PGHOST: db
      PGUSER: feldspar
      PGDATABASE: feldspar
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      - feldspar-data:/var/lib/feldspar
    # Chromium (the coding agent's view_app) keeps its sandbox, which needs this
    # profile: Docker's default with clone/unshare/chroot allowed. It is the
    # file `feldspar seccomp-profile` prints.
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Chromium keeps its shared memory here; Docker's 64 MB default is too small
    # for a page of any size.
    shm_size: 512m

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: feldspar
      POSTGRES_DB: feldspar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feldspar -d feldspar"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  feldspar-data:
  db-data:
