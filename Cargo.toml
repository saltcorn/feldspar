[workspace]
resolver = "3"
members = [
    # Layer 0 — foundations
    "crates/sc-error",
    "crates/sc-log",
    "crates/sc-config-file",
    # Internationalisation (TODO "one catalogue, two runtimes"): the `Locale`,
    # the negotiation, the catalogue, the message format, the `t!` macros and
    # the `Translator` seam. Layer 0, beside the error type and for the same
    # reason: `sc-types` and `sc-auth` have to be able to translate a sentence
    # they are about to hand to a person, and the dependency cannot point the
    # other way.
    "crates/sc-i18n",
    # Name resolution for the whole process, glibc's NSS taken out of the path
    # (§13.5): layer 0 because it is linked in front of libc rather than called.
    "crates/sc-dns",
    # Layer 1 — query language, expression language
    "crates/sc-query",
    "crates/sc-expr",
    # The repo map (TODO §11): tree-sitter tags and a ranking over them, pure and
    # with no store behind it. A crate of its own so its C grammars are built
    # once, not by everything that depends on the coding trait.
    "crates/sc-repomap",
    # The Python code adapter (TODO "The Python code adapter"): `sc-expr`'s own
    # `CodeCall` and five host traits, run on an embedded CPython instead of on
    # V8. Here rather than beside `sc-module` because that is what it depends
    # on — the seam and nothing above it — and because a second guest language
    # is a peer of the first, not a consumer of the server.
    "crates/sc-python",
    # Layer 2 — database
    "crates/sc-db",
    "crates/sc-db-postgres",
    "crates/sc-db-sqlite",
    # Layer 3 — types
    "crates/sc-types",
    # Layer 4 — catalog
    "crates/sc-catalog",
    # Layer 5 — users/auth, files, configuration values
    "crates/sc-auth",
    "crates/sc-files",
    "crates/sc-config",
    # Datasets (analytics TODO A1): a base and an ordered list of operations,
    # compiled to one `sc-query` statement, and the `_fd_datasets` table. Layer
    # 5 because it needs the catalog, the formula language and the query AST,
    # and because `sc-model` (layer 6) fits models to datasets and must depend
    # on it rather than the other way round.
    "crates/sc-dataset",
    # Layer 6 — actions & triggers, the LLM provider seam and the mail transport
    "crates/sc-action",
    # Predictive models: the dataset, the frame, the split, the provider seam
    # and the fit. Beside the actions rather than above the row layer its data
    # comes from, because a module supplies model providers the way it supplies
    # actions and table providers, and `sc-module` (layer 6) can only implement
    # a trait declared below it. The cost is that this crate cannot read a row:
    # it declares `DatasetSource` and `sc-server` fills it in (TODO §4).
    "crates/sc-model",
    # The Analytics UI's server half (analytics TODO A1.12): workspaces now,
    # and the plot spec, the stats, the tests and the map layers as the
    # milestones bring them. Beside `sc-model`, which a model fit workspace and
    # a scored dataset reach.
    "crates/sc-analytics",
    # Bayesian models with Stan (TODO "Bayesian models with Stan" §4): CmdStan
    # discovery and installation, and — as the milestone lands — the program's
    # declaration parser, the compile cache, the runner and `StanProvider`.
    # Beside `sc-model` and above it, not inside it: everything that is not
    # Stan-specific (the binder, the draws, the posterior summary) is
    # `sc-model`'s, so a second Bayesian provider would not reimplement it, and
    # what is Stan-specific is a subprocess and its files, which no other crate
    # needs to know about. There is no Cargo feature: nothing is linked, so
    # whether Stan is available is a runtime fact.
    "crates/sc-stan",
    # Streams: dataflows as an entity — the provider seam, the element type and
    # the supervisor that keeps a subscription running (TODO "Streams"). At
    # `sc-model`'s layer for `sc-model`'s reason: a module supplies stream
    # providers, and `sc-module` (layer 6) can only implement a trait declared
    # below it. The cost is the same one — this crate cannot fire a trigger or
    # open a socket: it declares `StreamSink` and `StreamObserver`, and
    # `sc-server` fills them in.
    "crates/sc-stream",
    # Modules: Saltcorn v1 JavaScript plugins. Beside the actions rather than
    # above them, because what a module supplies *is* an `Action` (§15).
    "crates/sc-module",
    "crates/sc-llm",
    "crates/sc-email",
    # Layer 7 — agents: the agent record, the trait extension point, the loop
    "crates/sc-agent",
    # Layer 7 — workflows: the program a trigger body can be, its versions, and
    # the engine that advances a run of it durably (§10.3). Beside the agents
    # rather than above them: both are things that *run*, both persist their
    # state to `_fd_runs` after every step, and neither knows about the other.
    "crates/sc-workflow",
    # Layer 8 — applications & API
    "crates/sc-api",
    "crates/sc-app",
    # Saltcorn UI: v1-style views and pages, owned by an application. Above
    # `sc-app` because it implements `Framework`; `sc-module` implements its
    # runtime seam from above.
    "crates/sc-viewpattern",
    # Layer 9 — the core built-in actions (above the row layer, because three of
    # them write rows through it), the core built-in agent traits (above it for
    # exactly the same reason) and the server
    "crates/sc-core-actions",
    "crates/sc-core-traits",
    "crates/sc-server",
    # Layer 10 — CLI binary
    "crates/sc-cli",
    # Cross-crate integration-test harness (shared helper; not published)
    "tests/harness",
]

# Shared package metadata inherited by every member crate via `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Saltcorn contributors"]
repository = "https://github.com/saltcorn/feldspar"
rust-version = "1.85"

# Internal crates are referenced by path so the strict layering in the technical
# design (§2) is expressed directly in the dependency graph.
[workspace.dependencies]
sc-error = { path = "crates/sc-error" }
sc-log = { path = "crates/sc-log" }
sc-i18n = { path = "crates/sc-i18n" }
# `feldspar.toml` — the deployment file naming this machine's databases. Layer 0
# because both ends of the workspace read it: the binary, to know where the
# primary database is, and the integration-test harness, to know which database
# it may create its per-test databases from.
sc-config-file = { path = "crates/sc-config-file" }
# The process's resolver. Depended on by the binary alone: what it exports is a
# pair of C symbols the linker puts in front of glibc's, which is a property of
# the *link*, not of any caller.
sc-dns = { path = "crates/sc-dns" }
sc-query = { path = "crates/sc-query" }
# `default-features = false` at the workspace level so members choose: the
# catalog takes the parse/validate/translate half only; the server adds
# `features = ["eval"]` for the V8-backed reified evaluator.
sc-expr = { path = "crates/sc-expr", default-features = false }
# `default-features = false` for `sc-expr`'s reason: the Python runtime rides
# behind `sc-python`'s own `python-host` feature, so a consumer that only holds
# an `Arc<dyn CodeAdapter>` links no interpreter.
sc-python = { path = "crates/sc-python", default-features = false }
sc-db = { path = "crates/sc-db" }
sc-db-postgres = { path = "crates/sc-db-postgres" }
sc-db-sqlite = { path = "crates/sc-db-sqlite" }
sc-types = { path = "crates/sc-types" }
sc-catalog = { path = "crates/sc-catalog" }
sc-auth = { path = "crates/sc-auth" }
sc-files = { path = "crates/sc-files" }
sc-repomap = { path = "crates/sc-repomap" }
sc-config = { path = "crates/sc-config" }
sc-dataset = { path = "crates/sc-dataset" }
sc-action = { path = "crates/sc-action" }
sc-model = { path = "crates/sc-model" }
sc-analytics = { path = "crates/sc-analytics" }
sc-stan = { path = "crates/sc-stan" }
sc-stream = { path = "crates/sc-stream" }
sc-module = { path = "crates/sc-module" }
sc-llm = { path = "crates/sc-llm" }
sc-email = { path = "crates/sc-email" }
sc-agent = { path = "crates/sc-agent" }
sc-workflow = { path = "crates/sc-workflow" }
sc-api = { path = "crates/sc-api" }
sc-app = { path = "crates/sc-app" }
sc-viewpattern = { path = "crates/sc-viewpattern" }
sc-core-actions = { path = "crates/sc-core-actions" }
sc-core-traits = { path = "crates/sc-core-traits" }
sc-server = { path = "crates/sc-server" }
sc-test-harness = { path = "tests/harness" }

# --- Core third-party dependencies, pinned once for the whole workspace ------
#
# Runtime decision (TODO Phase 0): the workspace is built on the **tokio** async
# runtime. Every async trait in the technical design (`DatabaseDriver`,
# `TableProvider`, `FileStore`, `ApiProvider`, …) is expressed with `async_trait`
# over tokio.
#
# Postgres driver decision: **tokio-postgres + deadpool-postgres**, not sqlx.
# `sc-query` already renders a `Statement` into `(sql, binds)`, so sqlx's
# compile-time-checked query macros would add no value; tokio-postgres gives
# native `$n` parameter binding and row streaming that map directly onto the
# design's `RowStream`, and deadpool-postgres supplies pooling. This keeps the
# dependency graph minimal (design principle: minimal, acyclic deps).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
    "sync",
    "io-util",
    # `process` drives a code framework's build step (design §13.3): the bundler
    # is an external process, awaited without blocking a runtime thread.
    "process",
] }
async-trait = "0.1"
# Async stream abstractions for `RowStream` (the type `DatabaseDriver::query`
# returns). Only the lightweight `Stream` trait + combinators are used.
futures = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `feldspar.toml` configuration file (`sc-cli`): per-environment database
# connection parameters, read when the environment does not supply them. TOML
# rather than YAML or JSON because it is the format a Rust operator already has
# a parser for in every other tool on the box, it has comments (a JSON config
# file cannot carry the sentence explaining why staging points where it does),
# and its failure mode is a parse error with a line number rather than YAML's
# silent type coercion. `default-features = false` drops the serializer
# (`display`): nothing writes this file — an operator does — so the crate is
# built as a reader only.
toml = { version = "1.1", default-features = false, features = [
    "std",
    "parse",
    "serde",
] }
uuid = { version = "1", features = ["v4", "serde"] }
# The two ICU4X primitives `sc-i18n` is built on, and deliberately only those
# two. `icu_locale_core` is the BCP-47 parser and the canonical `Locale` value —
# a language tag is a grammar, not a string to split on hyphens — and
# `icu_plurals` selects the CLDR plural category for a count, which is the same
# data `Intl.PluralRules` gives the browser half of this facility, so the two
# runtimes agree by construction rather than by a table somebody maintains.
# `compiled_data` (both crates' default) bakes the CLDR data into the binary:
# there is no provider to configure and no data directory to ship, which is what
# keeps a layer-0 crate a layer-0 crate.
icu_locale_core = "2"
icu_plurals = "2"
# argon2id password hashing. Pinned to the stable 0.5 line (0.6 is only an RC).
# `std` pulls in `getrandom` (via rand_core) so a random salt can be drawn from
# the OS CSPRNG (`OsRng`) when hashing.
argon2 = { version = "0.5", features = ["std"] }
# SHA-256 for session tokens at rest (§7.2). A *fast* hash on purpose: a session
# token is 256 bits of uniform randomness, so there is no dictionary for a slow
# hash to defeat — argon2 above is for passwords, which are guessable.
sha2 = "0.10"
# Line and character diffs for the coding trait (TODO §6): the run's unified
# diff and diffstat from the change ledger, and the similarity ratio the edit
# cascade's fuzzy step scores a candidate region by.
similar = "2"
# Bounded LRU for the session cache (§7.2): capacity bounds memory, and the
# store's own freshness TTL bounds staleness.
lru = "0.12"
# Postgres driver + pool. `with-*` features light up ToSql/FromSql for the
# `Value` variants the driver maps in later phases.
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14"
# SQLite driver decision: **rusqlite**, with the amalgamation compiled in
# (`bundled`). SQLite is an in-process C library rather than a server, so there
# is no async client to choose: every call blocks the calling thread, and the
# driver runs them on tokio's blocking pool. `bundled` rather than the system
# library because the features this driver depends on are recent — `RETURNING`
# (3.35), the `->` JSON operator (3.38), `IS DISTINCT FROM` and right/full joins
# (3.39) — and a distribution's libsqlite3 is whatever that distribution froze.
rusqlite = { version = "0.40", features = [
    "bundled",
    # `Statement::columns()`, which reports each result column's *declared*
    # type — the one thing that lets a value be read back as the timestamp,
    # uuid or json it was written as, in a database that stores five types.
    "column_decltype",
    # Scalar and aggregate functions defined in Rust. The bundled amalgamation
    # is compiled without SQLite's math functions, and a dataset's standard
    # deviation (analytics TODO A1.4) needs `sqrt` and `stddev_samp` to mean
    # on SQLite what they mean on Postgres — see `sc-db-sqlite`'s `functions`.
    "functions",
] }
# tokio-postgres re-exports `bytes` in its `ToSql`/`FromSql` signatures; pinned
# here so the Postgres driver names the same version.
bytes = "1"
# Temporal + decimal backing for the `Value` enum (Date/Time/Timestamp/Decimal).
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
# JavaScript expression parser for ownership formulas (`sc-expr`, TODO Phase 1).
# swc rather than a hand-rolled parser because the reified evaluator is real V8
# (`deno_core`): the parser must accept exactly what V8 accepts, and swc is the
# parser family Deno itself builds on. Parse-only — no transforms, no codegen —
# and the swc AST never leaves `sc-expr`: it is lowered to the crate's own
# `Ast` at the parse boundary.
swc_common = "24"
swc_ecma_ast = "26"
swc_ecma_parser = "42"
# The reified formula evaluator (TODO Phase 3): a real V8 isolate via deno_core,
# so a formula runs under exactly the engine whose grammar swc parses. Built
# with no extensions and no ops — the sandbox has no I/O to reach. Pulls the
# prebuilt static rusty_v8 lib on the big platforms; FreeBSD builds V8 from
# source (upstream carries the ports patches but publishes no binary).
deno_core = "0.408"
# **The Python code adapter** (TODO "The Python code adapter"), behind
# `sc-python`'s `python-host` feature and linked by nothing else. PyO3 embeds
# CPython by *linking* it, so this dependency is what decides whether a build
# needs `libpython` present to exec at all — which is why it is a feature that
# is off by default and why `sc-server`'s shipped `+crt-static` artifact cannot
# carry it (TODO phase 0.5a). `abi3-py311` is the stable-ABI floor: one build
# runs against every CPython from 3.11 up.
#
# Costs, measured in phase 0 against the `deno_core` the workspace already
# links: +7 crates in the lock file, +3.0 s of clean build, +0.5 MB of stripped
# binary, and 6.5 MB of resident interpreter once it is initialised.
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }
# **Modules in-process** (TODO "Modules in-process", phase 1), behind
# `sc-module`'s `deno-host` feature and linked by nothing else: `deno_runtime` is
# `deno_core` plus Node — a module loader, `require`, `node:*`, and a permission
# model `node` has none of. Pinned *together* with `deno_core` from here on:
# every `deno_runtime` release bumps its `deno_core`, so `sc-expr` and
# `sc-module` upgrade in one step or not at all.
#
# **No features here, and a second copy of this crate in `sc-module`'s
# `[build-dependencies]` with `snapshot` on.** `deno_core` does not embed its
# extensions' JavaScript: it records the absolute path each file had on the build
# machine and reads it at every worker start unless a V8 startup snapshot holds
# it — so a server built on one machine and run from a tarball on another could
# not start a module worker at all. `sc-module`'s `build.rs` makes that snapshot,
# and with the extension sources arriving pre-transpiled the runtime no longer
# needs `transpile` (which is `deno_ast`, i.e. swc, out of the link).
#
# The snapshot buys the portability and costs an ordering: V8 shares one
# read-only heap per process and the first isolate establishes it, so the
# snapshot-backed isolate has to be built before `sc-expr`'s bare ones.
# `crates/sc-module/src/deno/wiring.rs` has the measurement and the reasoning,
# and `sc_module::prime_v8` is the fix.
#
# It is a large dependency and the phase 0 gate measured it: +4.5 minutes of
# clean build and +78 MB of stripped binary, and adding it here took this
# workspace's lock file from 561 packages to 1005. Plus **`libclang` as a new
# build-time requirement**, because four of the runtime's unconditional
# extensions reach `rusqlite/session` → `buildtime_bindgen`. The snapshot build
# adds a second compilation of the same tree for the host, because cargo's v3
# resolver does not unify build-dependency features with ordinary ones.
deno_runtime = { version = "0.263" }
# The three resolver crates `deno_runtime`'s node compatibility layer is wired
# from. `ByonmNpmResolver` — "bring your own node_modules" — is the whole reason
# the installer does not change: npm puts the directory there and this only
# resolves out of it. No Deno npm cache, no lockfile, no registry client.
deno_resolver = { version = "0.86", features = ["sync"] }
node_resolver = { version = "0.93", features = ["sync"] }
deno_path_util = "0.6.4"
# `deno_error`'s version is pinned exactly because `JsErrorBox` crosses the
# `NodeRequireLoader` trait boundary: a second copy of the crate in the tree is
# a type mismatch, not a duplicate.
deno_error = "=0.7.1"
# The filesystem/environment abstraction `deno_node`'s `ExtNodeSys` is generic
# over. The server uses the real one.
sys_traits = { version = "0.1.28", features = ["real"] }
# Regex engine for the `String` rich type's `regex` attribute (§2.2). `regex-lite`
# rather than `regex`: a field-validation pattern needs correct matching, not the
# full crate's SIMD/perf dependency tree (aho-corasick, memchr, regex-automata),
# which would pull weight into layer 3 for no gain. Same `Regex::new`/`is_match`
# API for the subset validation uses.
regex-lite = "0.1"
# Extension → MIME mapping for a `File` field's MIME allow-list (§3.5). Already in
# the tree (tower-http's `fs` feature), pinned here as a first-class dependency.
mime_guess = "2"
# RFC 4180 CSV reader/writer for a table's bulk import/export (§13.1). A
# hand-rolled splitter is a line of code until the first quoted field with an
# embedded comma, newline or doubled quote in it — which is precisely what a
# spreadsheet exports — so the format is delegated to the crate that already
# gets those right. `csv` + `csv-core` are the only additions: its remaining
# dependencies (serde, memchr, itoa, ryu) are already in the tree.
csv = "1"
# The backup format: one zip holding an installation's metadata, its rows and its
# files (§16). `zip` is the crate for it — a hand-rolled writer is a weekend until
# the first central-directory edge case, and a backup nobody can open with `unzip`
# is not a backup. `default-features = false` drops every compression method but
# the one a backup wants: `deflate-flate2-zlib-rs` is DEFLATE (what every
# unarchiver on every desktop reads) through a **pure-Rust** zlib, so §16's
# no-C-dependencies posture holds here as it does for TLS. No `aes-crypto`, no
# bzip2/lzma/zstd: a format only this system writes gains nothing from methods a
# reader might not have.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
# A Stan fit's raw run is published with its chains' CSVs gzipped (Stan TODO
# §14): `chain-1.csv.gz` is what `cmdstanpy.from_csv` and every other Stan tool
# read. Already in the tree through `zip`, on the same pure-Rust zlib backend.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# --- HTTP server framework ---------------------------------------------------
#
# Web framework decision (design §16): **axum**, on hyper + tower. It is
# maintained by the tokio team and runs directly on the already-chosen
# tokio/hyper stack with no separate runtime (unlike actix-web's actix-rt);
# handlers are plain async fns rather than macro-driven routing (unlike Rocket);
# and it is unopinionated enough to build the reified `Endpoint` registry
# (design §13.1) on top of. tower / tower-http supply the middleware the design
# needs — strict CSP + security headers (`set-header`) and `ServeDir` (`fs`) to
# serve the built `ui/admin` SPA bundle. `matchit` is axum's own path-router
# crate, used directly to dispatch application routes that are registered at
# runtime and are therefore not known at compile time (design §13.1). `axum-extra`
# supplies the cookie jar for session cookies; the session store itself stays in
# `sc-auth`. Versions track the current axum 0.8 stable line; exact pairings are
# confirmed when Phase 6 first compiles against them.
# `ws` carries the file-store IDE's language server (§12.1): one WebSocket per
# workbench, bridged to a `typescript-language-server` process on the server.
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }

# --- TLS termination (design §13.5) ------------------------------------------
#
# The server terminates TLS itself so a deployment needs no reverse proxy, and
# it does it with **rustls** — the same stack `reqwest` already brings, and no
# OpenSSL anywhere in the tree (§16).
#
# `axum-server` is the piece axum does not have: `axum::serve` takes a
# `TcpListener` and knows nothing about a TLS handshake, whereas `axum-server`
# accepts through an `Accept` implementation — which is exactly the seam both
# certificate sources plug into (a fixed rustls config for a pasted
# certificate, `rustls-acme`'s acceptor for an ACME one). `tls-rustls` rather
# than `tls-rustls-no-provider` so rustls's `aws-lc-rs` provider is compiled in
# and can be installed by name at boot: two crypto providers reach the tree
# (this and `ring`, via other dependencies), and rustls refuses to guess between
# them.
axum-server = { version = "0.8", features = ["tls-rustls"] }
# Building a `ServerConfig` from a pasted certificate, and installing the
# process-wide crypto provider. Version-pinned with `axum-server` and
# `rustls-acme`, which both hand us `rustls` types — two rustls versions in one
# binary would be two unrelated `ServerConfig`s that do not typecheck against
# each other.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "std",
    "tls12",
] }
# Parsing the admin's pasted PEM. Deliberately a parser rather than a
# hand-rolled base64 splitter: "which of PKCS#8, PKCS#1 and SEC1 is this key?"
# is not a question to answer with `starts_with`.
rustls-pemfile = "2"
# The ACME client (§13.5): pure Rust, no `certbot` process, and it answers the
# **TLS-ALPN-01** challenge inside the TLS handshake it is already terminating —
# so there is no HTTP-01 route to open on port 80 and nothing to keep in step
# with the router. `tokio` is the runtime feature; `axum` supplies the
# `axum-server` acceptor so both certificate sources reach the listener the same
# way.
rustls-acme = { version = "0.15", features = ["tokio", "axum"] }
# The resolver behind `sc-dns`, and the C types its `getaddrinfo` speaks.
#
# glibc's own resolver `dlopen`s a shared object per module on the `hosts:` line
# of `/etc/nsswitch.conf`, which drags a second, dynamic `libc.so.6` into a
# statically linked binary and kills it — so this process resolves names in Rust
# instead (see `crates/sc-dns`). `hickory-resolver` is already in the tree as
# `deno_net`'s dependency, so the switch costs no new vendor: `system-config`
# reads `/etc/resolv.conf`, `tokio` is the runtime the queries run on.
hickory-resolver = { version = "0.25", features = ["system-config", "tokio"] }
libc = "0.2"
# Certificate generation **for tests only** (a dev-dependency wherever it is
# used): a TLS test needs a certificate, and the two alternatives — checking one
# into the repository or asking a CA for one — are a key in git and a network
# dependency respectively. Already in the tree as `rustls-acme`'s own
# dependency, pinned here so there is one version of it.
rcgen = "0.13"
# Base64 for carrying file bytes across the JSON file-manager API (§14.1). The
# file endpoints reuse the same typed-JSON dispatch as the rest of the admin API
# rather than special-casing binary routes, so file contents ride in JSON as
# base64 (with a UTF-8 `text` shortcut for editing text files).
base64 = "0.22"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
matchit = "0.8"
# A WebSocket **client**, for tests only: the IDE's language-server route (§12.1)
# is the one piece of the server a `tower::oneshot` cannot exercise, because the
# thing under test happens *after* the 101. Same version axum's `ws` feature
# already builds, so this adds no new code to the tree.
tokio-tungstenite = "0.29"
# The headless browser behind the coding agent's `view_app` (TODO §7b): the
# DevTools protocol from Rust, so the server needs no Node, no Playwright and no
# shell to look at an application. It drives an external Chromium; it does not
# download one (no `fetcher` feature).
chromiumoxide = { version = "0.9", default-features = false }
# The repo map's parsers (TODO §11). `tree-sitter-tags` is the tag extraction
# GitHub's code navigation uses, over the vendored queries in `sc-repomap`.
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"

# --- MQTT (TODO "Streams" §11) -----------------------------------------------
#
# The broker client behind `sc-stream`'s built-in MQTT provider, behind that
# crate's default-on `mqtt` feature. **rumqttc**: pure Rust, tokio, and an
# event loop that is *polled* rather than one that owns a callback — which is
# what lets a subscription be a task the `Subscription` handle owns and drops
# (§3), instead of a client that calls us back from a thread we do not control.
#
# `default-features = false` drops `use-rustls`, whose only content is
# `tokio-rustls/default` — i.e. rustls's **`ring`** provider. Two crypto
# providers in one binary is what `install_crypto_provider` exists to
# disambiguate, and adding a third relationship to that decision would be
# adding a second TLS stack in all but name. `use-rustls-no-provider` brings
# `tokio-rustls` with no provider of its own, so an MQTT connection is
# encrypted by the same **aws-lc-rs** rustls the HTTPS listener and `reqwest`
# already use (§16: one TLS stack in the tree).
rumqttc = { version = "0.25", default-features = false, features = [
    "use-rustls-no-provider",
] }
# The root store an `mqtts://` connection verifies the broker against.
#
# Direct rather than through rumqttc's own `TlsConfiguration::default()`,
# which loads the platform certificates and **panics** if it cannot
# (`.expect("could not load platform certs")`). A machine with no
# `ca-certificates` installed is a configuration error, and a configuration
# error has to become a stream that is `failed` with a sentence the admin can
# act on — not a panic in the supervisor's task, which would take every other
# stream's supervision with it. Same version rumqttc pins, so there is one
# copy of it in the tree.
rustls-native-certs = "0.8"

# --- GraphQL -----------------------------------------------------------------
#
# GraphQL library decision (TODO "GraphQL API" decision 1): **async-graphql**
# with the `dynamic-schema` feature. Our schema is *data* — an admin or an agent
# creates a table at runtime and the API must have it at the next mount — which
# rules out every macro-driven library (`juniper`) outright, since a
# compile-time schema means generating Rust and restarting the server.
# `async_graphql::dynamic` builds a schema from runtime values and brings
# parsing, validation, variable coercion, introspection, `sdl()`, error
# formatting and the depth/complexity limits with it; `apollo-compiler`, the
# runner-up, parses and validates but does not execute, and would have us write
# variable coercion and the error format for no capability we lack. The full
# survey is §1 of docs/GRAPHQL_API.md.
#
# **The stable 7.2 line, not the 8.0 release candidates.** 8.0 is at `-rc` and
# an API surface this central is not somewhere to track a release candidate.
#
# `default-features = false` drops the web-framework integrations, the
# playground HTML and the tracing/opentelemetry extensions: this crate is
# transport-agnostic (`ApiRequest`/`ApiResponse`, never axum types), the
# explorer is an admin screen rather than a CDN-loaded GraphiQL, and the
# application CSP is `default-src 'self'`. `dataloader` is the batching the
# level-batched executor keys child lists through (decision 3).
async-graphql = { version = "7.2", default-features = false, features = [
    "dynamic-schema",
    "dataloader",
] }

# --- HTTP client -------------------------------------------------------------
#
# Client decision (TODO Phase 3, the `fetch` action): **reqwest**, with
# `default-features = false` and `rustls-tls` — no OpenSSL anywhere in the tree,
# matching §16's pure-Rust TLS posture (a deployment must not need a system
# libssl to call a webhook). It rides the hyper/tokio stack the server already
# has, so this adds a TLS stack and the client itself, not a second runtime.
# `json` is the request-body serialiser only; responses are read as bytes and
# parsed with `serde_json` here, so the crate's charset machinery is not needed.
#
# **0.13, because `rig-core` builds on it** (TODO Phase 1). The `fetch` action
# was written against 0.12; letting `sc-llm` pull its own would put two reqwests,
# two hyper stacks and two rustls configurations in one binary — the thing
# pinning versions here exists to prevent. The 0.13 rename of `rustls-tls` to
# `rustls` is the whole of the migration, since nothing in the tree touches the
# parts that changed shape.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }

# HTML → Markdown for the agent's `http` trait (`fetch_<name>`). `htmd` is a
# port of Turndown — the converter Claude Code's and OpenCode's web fetch both
# run — over html5ever, so a page is parsed the way a browser parses it rather
# than by regular expression, and the result is the Markdown a model reads
# best. `markup5ever_rcdom` is the tree it parses into, named directly because
# the trait walks that tree first: to pick the page's `<main>` over its
# navigation, lift the `<title>`, and make relative links absolute so the model
# can follow them. Pinned to the version `htmd` itself builds on.
htmd = "0.5"
markup5ever_rcdom = "0.38"

# `coding`'s `view_image`: what an image file is, how big, and — for one too
# large to send a model as it is — a scaled copy. Already in the tree through
# deno's canvas, pinned to its version and to the four formats a model reads.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# --- Mail transport (design §18.2) -------------------------------------------
#
# The SMTP client behind `sc-email`'s own `Mailer` seam. `lettre` is the crate
# for it: it is the maintained Rust SMTP client, it builds the MIME message as
# well as sending it (so `multipart/alternative` is a method call rather than a
# hand-written boundary), and it has an async transport over tokio.
#
# `default-features = false` drops `native-tls`, `hostname` and the sendmail
# transport. The rest of the set is chosen to add **no new crates to the tree**:
# `aws-lc-rs` is the crypto provider the `rustls` pin above already compiles in
# — two providers in one binary is exactly what that pin exists to prevent — and
# `rustls-platform-verifier` is the root store `reqwest` 0.13 already brings, so
# a mail server's certificate is verified against the same roots a webhook's is.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "pool",
    "tokio1",
    "tokio1-rustls",
    "rustls",
    "aws-lc-rs",
    "rustls-platform-verifier",
] }

# The MJML compiler behind `sc-email::render_mjml`. MJML is the markup an email
# designer already writes — `mj-section`/`mj-column`/`mj-button` instead of the
# nested tables and conditional comments a message has to be for Outlook to lay
# it out — and `mrml` is the Rust reimplementation of it, so a body written that
# way compiles **in process** rather than through a Node sidecar (v1 ran MJML's
# own JavaScript implementation, which is why it needs one).
#
# `default-features = false` keeps `parse` and `render` and drops `json` (the AST
# as serde, which nothing here serialises) and `print` (writing MJML back out).
# The default include loader refuses `mj-include`, which is the behaviour we
# want: a template is data an admin typed, and it must not be able to make the
# server read a file or call a URL.
mrml = { version = "6.0", default-features = false, features = [
    "parse",
    "render",
] }

# --- LLM providers -----------------------------------------------------------
#
# The provider calls behind `sc-llm`'s own object-safe seam (design §11.1, TODO
# Phase 1 decision 1). `rig-core` is the only surveyed crate carrying OpenAI's
# **Responses** API as a first-class provider *and* a maintained Anthropic
# provider; the survey and the rejected alternatives are in §11.1.
#
# `default-features = false` because rig's defaults pull the derive macro, rayon
# and the document loaders (pdf, epub, image), none of which a provider call
# needs. `reqwest` + `rustls` are the two features that matter: they make rig
# build on the same HTTP client the `fetch` action already uses — which is why
# the reqwest pin above is 0.13 — and keep TLS pure-Rust per §16.
#
# **Only the call is rig's**: not its `Agent`, not its tool registry, not its
# RAG. Nothing rig exposes appears in an `sc-llm` public signature, for the
# reason §2 gives generally — a provider abstraction is exactly the kind of
# dependency whose API churns.
rig-core = { version = "0.41", default-features = false, features = [
    "reqwest",
    "rustls",
] }

# --- The built-in model providers (TODO "Predictive models" §13) --------------
#
# The five machine-learning built-ins — `linear_regression`, `logistic_regression`,
# `random_forest`, `kmeans` and `pca` — are smartcore's algorithms behind
# `sc-model`'s own provider seam. It is a **pure-Rust, dependency-light** library
# (num, ordered-float, rand and nothing else): no BLAS, no LAPACK, no system
# library, so the server still builds and links the way it did. GOALS asks for
# exactly this set and asks for it behind a feature flag, which is `sc-model`'s
# `smartcore` feature (default on).
#
# The `serde` feature is what makes a fit *survivable*: a fitted instance is a
# JSON column, so a random forest is stored by serialising smartcore's own model
# and read back by deserialising it. Without it a fit could not be applied after
# a restart, which is the whole point of storing one. It pulls `typetag` on
# non-wasm targets (smartcore's SVM kernels are trait objects); nothing here uses
# the SVMs, but the feature is not divisible.
smartcore = { version = "0.6", default-features = false, features = ["serde"] }
# The distribution functions the two hypothesis tests need: Student's *t* for the
# t-test and for a regression coefficient's *p*, Fisher–Snedecor's *F* for the
# ANOVA. **Not** behind the `smartcore` feature — §13's rule — because a build
# with the machine learning compiled out should still be able to answer whether
# two groups differ, and because a CDF is arithmetic rather than a model.
#
# `default-features = false` with `std` alone drops `nalgebra` (the multivariate
# distributions) and `rand` (sampling): what is wanted here is two CDFs, and the
# linear-algebra dependency of a statistics crate is not a cost this workspace
# should pay for them.
statrs = { version = "0.19", default-features = false, features = ["std"] }
# BYM2's scaling factor (Stan TODO §12): the diagonal of the generalised inverse
# of a graph Laplacian, from a symmetric eigendecomposition. It was already in
# `Cargo.lock` as statrs's optional dependency (the feature is off above), so
# this is the version that resolves — but it is compiled for `sc-model` alone.
nalgebra = { version = "0.35", default-features = false, features = ["std"] }

# Workspace-wide lints. Principle 5 (no silent failures): library code must not
# `unwrap()`/`expect()` on fallible paths — return a `sc-error::Result` instead.
# Member crates opt in with `[lints]` + `workspace = true`. Test code is exempted
# via `clippy.toml` (`allow-unwrap-in-tests` / `allow-expect-in-tests`). These
# lints fire under `cargo clippy`, not `cargo build`/`cargo test`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# --- Build profiles ----------------------------------------------------------
#
# Debug-info budget. The workspace has ~110 integration-test targets, and every
# one of them statically links the same tree — V8 (`deno_core`), swc, hyper,
# rustls. With rustc's default `debug = true` each test binary landed at ~440 MB,
# almost all of it DWARF for dependency code, and each link peaked near 1.9 GB
# of linker RSS. `cargo test -j8` therefore ran ~8 of those concurrently and
# pushed the machine into memory pressure hard enough for `systemd-oomd` to kill
# the whole terminal cgroup mid-run.
#
# The split below keeps the debug info that is actually read and drops the rest:
# workspace crates keep line tables, so a panicking test still prints a
# backtrace with file:line — the only thing a test run needs — while
# dependencies get none, because nobody single-steps into V8's bindings. Full
# DWARF for a dependency is available on demand with a one-off
# `--config 'profile.dev.package."*".debug=true'`.
[profile.dev]
debug = "line-tables-only"

# Dependencies carry no debug info: this is the bulk of both the binary size and
# the linker's peak memory.
#
# This covers the test binaries too, and does not need restating under
# `[profile.test]`: `test` inherits from `dev`, and that inheritance carries
# `package."*"` overrides along with everything else. Verified rather than
# assumed — a `cargo test` build of a crate carrying only this key emits a
# dependency rlib with zero `.debug_info` sections, against 18 with the key
# removed.
[profile.dev.package."*"]
debug = false

# Release is tuned for build time, not run time, while the project is a
# prototype: `cargo build --release -p sc-cli` and `scripts/build-static.sh`
# (native and docker) both use this profile. Cargo's release defaults
# (`opt-level = 3`, 16 codegen units, no incremental) spent most of a build in
# LLVM's optimiser, for a speed-up nobody needs yet. The test suite already runs
# unoptimised code (`dev`), so `opt-level = 0` is not new territory. V8 is a
# prebuilt archive either way and is unaffected.
#
# Switch this back to optimising builds before a release anyone relies on the
# performance of.
[profile.release]
opt-level = 0
codegen-units = 16
incremental = true
debug = false
strip = true
