name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A GitHub-hosted runner has ~20 GB of free disk, and this workspace links a
  # static V8 (~180 MB) into **every** test binary. Running out of disk mid-link
  # does not fail politely — `rust-lld` dies with SIGBUS on the mapping it can no
  # longer back — so the space is bought back three ways: the binaries carry no
  # debug info, there is one test binary per crate rather than one per test file
  # (see any `crates/*/tests/it.rs`), and the runner's preinstalled toolchains
  # are deleted in the step below. The first two together took `--all-targets`
  # from ~185 binaries and ~70 GB to ~55 and ~7 GB.
  #
  # Debug info is the bulk of a binary and CI has no use for it: a failing test
  # still prints its assertion and a backtrace with symbol names, just without
  # line numbers. Incremental output is the same trade (it is 10 GB in a working
  # checkout) and buys nothing for a from-scratch build.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # `sc-cli`'s build script builds `ui/admin` and `ui/ide` by default, so a
  # developer's binary serves its own admin UI without having to remember a
  # variable. CI is the other case: these jobs check Rust — fmt, clippy, tests —
  # and none of them look at the bundles, so `npm ci` for two front ends (the
  # IDE alone is ~1 GB of monaco packages, on a runner whose disk is already the
  # constraint above) would be minutes and gigabytes spent per job on output
  # nothing here reads. Turned off; the release build that ships a binary is
  # where the bundles get built.
  SC_BUILD_ADMIN: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (rustfmt)
        run: rustup toolchain install stable --profile minimal --component rustfmt
      # No `rust-cache` here on purpose: `cargo fmt` compiles nothing, so the
      # cache it would save is an empty `target/` under a key of its own — spent
      # against a repository cache budget the other two jobs need.
      - run: cargo fmt --all --check

  # The dependency tree against `deny.toml`: RustSec advisories, licences,
  # banned crates and where crates may come from (security review 2026-11,
  # F §4). It reads `Cargo.lock` and the advisory database and builds nothing,
  # so it needs neither the cache nor the disk clean-up the other jobs do.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (clippy)
        run: rustup toolchain install stable --profile minimal --component clippy
      # The preinstalled Android SDK, .NET and Haskell toolchains are ~13 GB that
      # nothing here uses. Removing them is the difference between a build that
      # fits and one that fits *today*; `|| true` because a runner image that has
      # already dropped one of them must not fail the job.
      - name: Free disk space on the runner
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc || true
          df -h
      # `cache-on-failure` because the interesting failures here are late ones —
      # a test assertion, or a link that ran out of disk — and the default is to
      # save nothing when the job fails. That turns one red run into a cold
      # dependency build (~17 minutes) on every run after it, which is most of
      # why this workflow was slow.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `Swatinem/rust-cache` restores `target/`, but not all of it. The `v8`
      # crate (behind `sc-expr`'s `eval` feature) has a build script that
      # downloads a prebuilt `librusty_v8.a` into `target/<profile>/gn_out/`,
      # which the cache does not keep — while the build script's *fingerprint*,
      # which records that the download already happened, it does. Cargo then
      # skips the script and rustc fails the whole build with `could not find
      # native static library rusty_v8`.
      #
      # Dropping that fingerprint when the library is missing makes the script
      # run again and fetch it. It costs nothing in the two consistent states: a
      # warm cache that kept both, and a cold one that has neither.
      - name: Re-fetch the prebuilt V8 library if the cache dropped it
        run: |
          for profile in debug release; do
            fingerprints="target/$profile/.fingerprint"
            lib="target/$profile/gn_out/obj/librusty_v8.a"
            if [ -d "$fingerprints" ] && [ ! -f "$lib" ]; then
              echo "$lib is missing; forcing the v8 build script to run again"
              rm -rf "$fingerprints"/v8-*
            fi
          done
      # `--locked`: a `Cargo.lock` that no longer matches the manifests fails
      # here instead of being resolved afresh to whatever is newest today.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The lints that are advisory for now (TODO-type-hardening H1.7): indexing,
  # string slicing and unchecked arithmetic in the crates that handle request
  # input, each a panic a request could cause. They have hundreds of existing
  # hits, so this job reports and does not gate; the crates' `lib.rs` turn them
  # on under `--cfg feldspar_advisory_lints`, which goes to the linted crates
  # only (after `--`), so the dependencies are the clippy job's, from the cache.
  clippy-advisory:
    name: clippy (advisory lints)
    runs-on: ubuntu-latest
    # Under the workflow's `-D warnings` every hit is an error, so this job is
    # red until they are fixed; `continue-on-error` keeps that from failing the
    # run, and `--keep-going` lists every crate's hits rather than the first's.
    # (Clearing `RUSTFLAGS` here would rebuild every dependency.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (clippy)
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc || true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Re-fetch the prebuilt V8 library if the cache dropped it
        run: |
          for profile in debug release; do
            fingerprints="target/$profile/.fingerprint"
            lib="target/$profile/gn_out/obj/librusty_v8.a"
            if [ -d "$fingerprints" ] && [ ! -f "$lib" ]; then
              rm -rf "$fingerprints"/v8-*
            fi
          done
      - run: >-
          cargo clippy --locked --keep-going --lib
          -p sc-access -p sc-api -p sc-auth -p sc-backup -p sc-files -p sc-live -p sc-server
          -- --cfg feldspar_advisory_lints

  test:
    name: test
    runs-on: ubuntu-latest
    # A real Postgres is provided so integration tests (principle 4) can run
    # against it. The reset-per-test strategy is wired up in a later task.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saltcorn
          POSTGRES_PASSWORD: saltcorn
          POSTGRES_DB: saltcorn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltcorn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # **Not** the service's `POSTGRES_USER`: that role is a superuser, and
      # Postgres lets a superuser bypass row-level security entirely — even on a
      # table with FORCE ROW LEVEL SECURITY. Connecting as one makes the §6 RLS
      # tests fail (they watch a policy filter rows) and would make any future
      # test that merely *reads* through a policy pass for the wrong reason. The
      # role is created in the step below with the least it needs: log in, and
      # own the per-test databases the harness creates.
      DATABASE_URL: postgres://sc_test:sc_test@localhost:5432/saltcorn_test
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Create the non-superuser role the tests connect as
        env:
          PGPASSWORD: saltcorn
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
          psql -h localhost -U saltcorn -d saltcorn_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sc_test LOGIN CREATEDB PASSWORD 'sc_test'"
      # The preinstalled Android SDK, .NET and Haskell toolchains are ~13 GB that
      # nothing here uses. Removing them is the difference between a build that
      # fits and one that fits *today*; `|| true` because a runner image that has
      # already dropped one of them must not fail the job.
      - name: Free disk space on the runner
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc || true
          df -h
      # `cache-on-failure` because the interesting failures here are late ones —
      # a test assertion, or a link that ran out of disk — and the default is to
      # save nothing when the job fails. That turns one red run into a cold
      # dependency build (~17 minutes) on every run after it, which is most of
      # why this workflow was slow.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `Swatinem/rust-cache` restores `target/`, but not all of it. The `v8`
      # crate (behind `sc-expr`'s `eval` feature) has a build script that
      # downloads a prebuilt `librusty_v8.a` into `target/<profile>/gn_out/`,
      # which the cache does not keep — while the build script's *fingerprint*,
      # which records that the download already happened, it does. Cargo then
      # skips the script and rustc fails the whole build with `could not find
      # native static library rusty_v8`.
      #
      # Dropping that fingerprint when the library is missing makes the script
      # run again and fetch it. It costs nothing in the two consistent states: a
      # warm cache that kept both, and a cold one that has neither.
      - name: Re-fetch the prebuilt V8 library if the cache dropped it
        run: |
          for profile in debug release; do
            fingerprints="target/$profile/.fingerprint"
            lib="target/$profile/gn_out/obj/librusty_v8.a"
            if [ -d "$fingerprints" ] && [ ! -f "$lib" ]; then
              echo "$lib is missing; forcing the v8 build script to run again"
              rm -rf "$fingerprints"/v8-*
            fi
          done
      - run: cargo test --locked --workspace --all-targets
