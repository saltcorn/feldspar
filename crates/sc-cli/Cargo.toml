[package]
name = "sc-cli"
description = "The feldspar binary: serve and management commands (layer 10)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[features]
default = []
# The one name an operator builds a Python-capable `feldspar` with:
# `cargo build -p sc-cli --features python`. It is `sc-server`'s feature, which
# is `sc-python`'s, so there is one name from the command line down to the
# interpreter rather than three that have to be spelled together.
python = ["sc-server/python"]

[[bin]]
name = "feldspar"
path = "src/main.rs"

[dependencies]
sc-error.workspace = true
sc-log.workspace = true
sc-server.workspace = true
sc-api.workspace = true
sc-auth.workspace = true
sc-app.workspace = true
# `_fd_views` and `_fd_pages`, bootstrapped beside `_fd_applications`.
sc-viewpattern.workspace = true
sc-catalog.workspace = true
sc-files.workspace = true
# `_fd_llm_providers` is bootstrapped alongside the other stored-metadata tables
# at connect time (§9): an overlay may be created lazily, but a table whose rows
# *are* the definitions must exist before anything can list them.
sc-llm.workspace = true
# `_fd_agents` and `_fd_runs`, bootstrapped beside the other metadata tables.
sc-agent.workspace = true
# `_fd_config` and the ACME cache, bootstrapped the same way — and read at boot,
# because how this process serves TLS is a stored setting rather than a flag
# (§13.5).
sc-config.workspace = true
# The stored Localisation settings become this process's negotiation set at boot
# (§16.x), and `feldspar i18n` is this binary's command — which is the one
# caller of the `extract` feature, because extraction is a Rust pass run from a
# terminal and not a step in anybody's build (D6).
sc-i18n = { workspace = true, features = ["extract"] }
# The `FormField` vocabulary a configuration key is declared in: `get-cfg` and
# `set-cfg` read the declaration to know what type a value typed at a terminal
# has, and which keys are secrets to redact in a listing.
sc-types.workspace = true
# Name resolution for the whole binary. Depended on here and nowhere else: what
# it exports is `__wrap_getaddrinfo`, which `build.rs` puts in front of glibc's
# resolver at link time, and this dependency is what puts the rlib defining it on
# the link line.
sc-dns.workspace = true
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-db-sqlite.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
serde_json.workspace = true
# `auth token` writes a session row and mints the cookies that carry it: a UUID
# for the CSRF token, a `chrono` duration for the session's lifetime, and
# `sc-query`'s `Value` to read the user's email out of the row.
uuid.workspace = true
chrono.workspace = true
sc-query.workspace = true
# The `feldspar.toml` configuration file: named environments, each with one set
# of database connection parameters. It is its own crate because the
# integration-test harness reads the same file.
sc-config-file.workspace = true
# The eval harness's task files (`task.toml`), read with the same parse-only
# reader `feldspar.toml` uses.
toml.workspace = true
# The harness's task and report shapes are (de)serialised: a task file in, a
# report out.
serde.workspace = true
# The coding traits' per-run state, which is where the edit-cascade counts the
# eval reports live, and the run tree a planned run's metrics are added over.
sc-core-traits.workspace = true
# The `Translator` seam `feldspar i18n translate` implements over a configured
# LLM provider. The trait is async, so implementing it needs the same attribute
# every other seam in this workspace is declared with.
async-trait.workspace = true

# `feldspar cmdstan status | install`: finding CmdStan on this machine, and
# downloading and building one (TODO "Bayesian models with Stan" §20).
sc-stan.workspace = true

[dev-dependencies]
# The scripted provider (`sc-agent`'s `testing` feature, decision 7): the eval
# harness's self-test drives two whole runs, and §13 says no test may spend a
# token — least of all the test of the thing whose job is to spend them.
sc-agent = { workspace = true, features = ["testing"] }
# The end-to-end test presents the session this command writes to a real running
# server, which needs an HTTP client; nothing in the command itself does any more.
reqwest.workspace = true
sc-test-harness.workspace = true
# The status report's tests build a `CmdStan` and a `Toolchain` by hand.
sc-stan.workspace = true
axum.workspace = true
tower.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
