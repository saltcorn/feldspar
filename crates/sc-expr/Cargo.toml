[package]
name = "sc-expr"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The reified evaluator (Phase 3) rides behind the `eval` feature so that
# consumers which only parse/validate/translate — `sc-catalog` merging stored
# formulas — do not link V8 into their build. `sc-server` (Phase 5) turns it on.
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[features]
default = ["eval"]
eval = [
    "dep:deno_core",
    "dep:getrandom",
    "dep:tokio",
    "dep:sha2",
    "dep:hmac",
    "dep:argon2",
]

[dependencies]
# Required (not `eval`-gated): the `JsEvaluator` trait itself is part of the
# always-on API — consumers below the server hold `Arc<dyn JsEvaluator>`
# without linking an engine.
async-trait = { workspace = true }
deno_core = { workspace = true, optional = true }
# 128 bits per run token: the only thing separating two resident runs' authority
# on one isolate, so it wants the operating system's entropy and not a counter.
getrandom = { workspace = true, optional = true }
# A code body's `crypto` (TODO F1.2, F1.3): digests, HMAC, and argon2id
# password hashes with `sc-auth`'s parameters (`Argon2::default()`).
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
sc-error = { workspace = true }
sc-query = { workspace = true }
serde_json = { workspace = true }
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
swc_ecma_parser = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The file seam carries bytes base64-encoded, so the fake store the `fs` tests
# run against has to encode them the way the real host does.
base64.workspace = true
sc-test-harness = { workspace = true }
sc-db-postgres = { workspace = true }
tokio-postgres = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
