[package]
name = "sc-catalog"
description = "Catalog, Table, Field, TableProvider trait, cache (layer 4)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
sc-query.workspace = true
sc-db.workspace = true
# The concrete Postgres backend, for one reason: a *database connection* an
# admin adds in the UI (`db_connections`) is a row here, and turning that row
# into a driver needs the backend that can dial it. `sc-files::connect_from_def`
# names `LocalFileStore` for exactly the same reason — a definition and the
# thing it becomes belong within one crate of each other.
sc-db-postgres.workspace = true
# The same reason, for the other backend: a connection whose backend is `sqlite`
# is a file in a file store, and opening it needs the SQLite driver.
sc-db-sqlite.workspace = true
sc-types.workspace = true
sc-files.workspace = true
# Ownership formulas (§7.3): the catalog parses and validates a table's stored
# formula at merge time. The workspace dep defaults `sc-expr`'s features off,
# which keeps V8 (the `eval` feature) out of this crate's build — the catalog
# only ever parses, validates and describes; evaluation happens in the server.
sc-expr = { workspace = true }
async-trait.workspace = true
# A provided table's rows arrive as JSON, and a date among them is a string in
# whichever spelling the source uses — an RSS `pubDate` is RFC 2822. Reading it
# back as a `Value::Timestamp` is what makes ordering by it sort by date
# (`inmem`).
chrono.workspace = true
# The `_fd_file_stores` JSON columns (a backend's settings, sparse attributes).
serde_json.workspace = true
# UUID row identities for the `_fd_*` tables this crate stores (§9).
# The hoist of a formula's module function call is bounded here (§4b), which
# is the one thing in this crate that needs a clock.
tokio = { workspace = true }
uuid.workspace = true
# Secret fields (`secrets`): the envelope's cipher, its nonce, its spelling.
aes-gcm.workspace = true
getrandom.workspace = true
base64.workspace = true

[dev-dependencies]
sc-test-harness.workspace = true
tokio = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
