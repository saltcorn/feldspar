[package]
name = "sc-server"
description = "HTTP server: admin routes, auth, CSP (layer 9)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[features]
default = []
# The one name an operator builds a Python-capable server with. It links
# `libpython` into this binary (via PyO3), which is why it is a feature and not
# a flag: a binary built with it will not exec on a host with no
# `libpython3.x.so`, and this project's shipped `+crt-static` artifact cannot
# link it at all. `--python off|auto` is the *runtime* half of the question.
python = ["sc-python/python-host"]

[dependencies]
sc-error.workspace = true
sc-log.workspace = true
sc-catalog.workspace = true
# Ownership formulas (§7.3): validation, the RLS translatability check on
# save, and — via `eval` — the V8 engine behind the runtime enforcement's
# reified path. The server is the one place the engine is constructed
# (`default_js_evaluator`); everything below holds the trait.
sc-expr = { workspace = true, features = ["eval"] }
sc-auth.workspace = true
sc-files.workspace = true
sc-app.workspace = true
# Deleting an application deletes its views and pages (Saltcorn UI §1).
sc-viewpattern.workspace = true
sc-api.workspace = true
# The trigger system, brought up at boot (`install_triggers`): the dispatcher
# lives in `sc-action` and the built-in actions in `sc-core-actions`; this crate
# is where they meet the catalog, because it is the one that serves requests.
sc-action.workspace = true
sc-core-actions.workspace = true
# Modules: the `_fd_modules` table, the npm installer and the Node host whose
# actions join the registry the dispatcher runs from (TODO "Modules").
# `deno-host`: modules run on a `deno_runtime` worker **in this process** rather
# than in a `node` child (TODO "Modules in-process"). The server is the one crate
# that turns it on, which is what keeps `deno_runtime` — +444 packages in the
# lock file, and `libclang` as a build-time requirement — out of every other
# crate's test link.
sc-module = { workspace = true, features = ["deno-host"] }
# The Python code adapter (§15): the runtime a `run_python_code` body runs on,
# built at boot and registered on the dispatcher whether or not this binary has
# an interpreter linked in. Default features off — the interpreter itself is the
# `python` feature below, which is a *rebuild* and not a flag, so this dependency
# costs nothing until an operator asks for it.
sc-python.workspace = true
# The LLM providers an admin configures (§11.1): their storage, their backend
# registry, and the one request `testLlmProvider` makes. The agents that use them
# arrive a layer above in the next phase; this crate needs the provider seam
# because it is the one that serves the admin API.
sc-llm.workspace = true
# The agents themselves (§11.2): the record, the trait seam, the loop and the
# runs the chat socket drives. `sc-core-traits` is the built-in trait set the
# registry is assembled from — the same arrangement `sc-core-actions` has with
# the trigger dispatcher, and for the same reason: this crate is where the
# registry meets the catalog, because it is the one that serves requests.
sc-agent.workspace = true
# The workflow half of a trigger body (§10.3): the tables a workflow's versions
# and a run's trace live in, bootstrapped beside `_fd_triggers`, and — from the
# next phase — the engine this server installs on the dispatcher.
sc-workflow.workspace = true
# Predictive models (TODO "Predictive models"). This crate supplies the
# `DatasetSource` seam `sc-model` declares but cannot implement: reading a
# dataset's rows is `sc_api::rows`' job, and `sc-model` sits below it so a module
# can supply a model provider.
sc-model.workspace = true
# Bayesian models (the Stan TODO): `StanProvider` is registered here beside the
# built-ins, over the catalog's file stores, with whatever CmdStan discovery
# found at startup — always compiled, because availability is a runtime fact.
sc-stan.workspace = true
# Streams (TODO "Streams"): the `_fd_streams` table, the provider registry and
# the supervisor that keeps subscriptions running. This crate is where a
# delivered element becomes a **trigger event** — `sc-stream` sits at layer 6
# and knows nothing about triggers, applications or sockets, so the bridge is
# here, where both handles already are (§2's second seam).
sc-stream.workspace = true
sc-core-traits.workspace = true
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-query.workspace = true
sc-types.workspace = true
# The settings an admin edits (§13.5): the TLS section is read at boot to decide
# how the listener is set up, and written by the settings endpoints this crate
# serves. The ACME cache is a table there too, because it is *what this
# deployment serves TLS with* rather than anything this crate should own.
sc-config.workspace = true
# Locale negotiation on a request, the response headers it answers with, and the
# `Translator` the admin API's translate button runs over (§16.x).
sc-i18n = { workspace = true, features = ["extract"] }
# The mail transport (§18.2), for the one message this crate sends itself: the
# Email settings tab's test message, built from what is stored so it tests the
# configuration rather than the form.
sc-email.workspace = true

tokio.workspace = true
# The backup archive (`backup`): an installation's metadata, rows and files as one
# zip an admin downloads and hands back.
zip.workspace = true
axum.workspace = true
# TLS termination (§13.5). `axum-server` is the acceptor seam both certificate
# sources reach the listener through; `rustls` + `rustls-pemfile` build a config
# from a pasted certificate; `rustls-acme` obtains and renews one from a CA.
axum-server.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-acme.workspace = true
# The chat socket's client protocol, parsed rather than hand-matched (§11.4).
serde = { workspace = true }
# The async trait the provider connector is expressed as (§11.4) — and, in the
# tests, the `FileStore` double the IDE's language-server route has to refuse.
async-trait.workspace = true
# `SinkExt`/`StreamExt` over the split WebSocket the IDE's language server and
# the chat socket both ride on (§12.1, §11.4).
futures.workspace = true
axum-extra.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
matchit.workspace = true
base64.workspace = true
bytes.workspace = true
serde_json.workspace = true
uuid.workspace = true
# The DevTools-protocol client `view_app`'s browser driver is written on.
chromiumoxide.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
# A Saltcorn 1 backup lists its files in `files.csv` (`backup::v1`), so importing
# one means reading a CSV with the same parser the table import reads one with.
csv.workspace = true

[dev-dependencies]
# The Saltcorn UI golden-HTML test normalises what legitimately differs between
# two renders (a user's UUID, v1's random element ids).
regex-lite.workspace = true
sc-test-harness.workspace = true
# The SQLite backend, for the one test that connects a SQLite file as a
# secondary database through the admin API: the test has to *create* the file
# the admin then points at.
sc-db-sqlite.workspace = true
# The request log is asserted from the capture sink rather than from stderr
# (§16).
sc-log = { workspace = true, features = ["capture"] }
tokio-tungstenite.workspace = true
# Certificates for the TLS tests, generated in-process: a test must not carry a
# checked-in key (it would expire, and a repository is not where keys live) and
# must not reach a CA. `rcgen` is already in the tree — `rustls-acme` builds its
# challenge certificates with it.
rcgen.workspace = true
# An HTTPS *client* for the end-to-end TLS test: the one thing a
# `tower::oneshot` cannot exercise is the handshake, because the handshake
# happens below the service.
reqwest.workspace = true
# The scripted provider (`sc-agent`'s `testing` feature, decision 7): the chat
# socket is driven through a whole turn without a vendor and without a token.
sc-agent = { workspace = true, features = ["testing"] }
# And `sc-stream`'s, for the same reason: the trigger bridge and the observe
# sockets are driven through a whole stream without a broker.
sc-stream = { workspace = true, features = ["testing"] }

[lints]
workspace = true

# The aggregate: every test file under `tests/` that can share a process.
[[test]]
name = "it"
path = "tests/it.rs"

# The five that cannot. A binary runs its tests as threads of one process, and
# each of these reaches for something the whole process shares — so in the
# aggregate they would be changing the world out from under 48 other files.
#
#   build_updates_client  installs a module-declared framework in the registry
#   git_store_api    sets the data-directory variable, once, for all of its tests
#   modules_no_node  empties `PATH`, to assert what happens with no Node
#   sighup_reload    raises `SIGHUP` at itself; a signal has no narrower target
#   systemd_notify   sets `NOTIFY_SOCKET` and the watchdog variables
[[test]]
name = "build_updates_client"
path = "tests/build_updates_client.rs"

[[test]]
name = "git_store_api"
path = "tests/git_store_api.rs"

[[test]]
name = "modules_no_node"
path = "tests/modules_no_node.rs"

[[test]]
name = "sighup_reload"
path = "tests/sighup_reload.rs"

[[test]]
name = "systemd_notify"
path = "tests/systemd_notify.rs"
