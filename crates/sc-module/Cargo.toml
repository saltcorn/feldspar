[package]
name = "sc-module"
description = "Modules: Saltcorn v1 JavaScript plugins, installed with npm and run on a Deno worker in this process (layer 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The in-process runtime (TODO "Modules in-process", phase 1) rides behind
# `deno-host`, **off by default**, and `sc-server` turns it on. Off is what keeps
# `deno_runtime` — +444 packages in the lock file and a `libclang` build
# requirement — out of the test link of every other crate in the workspace, and
# the crate must go on building and testing without it for exactly that reason.
#
# Turning it on also raises this crate's build requirements: a C toolchain with
# `libclang` (set `LIBCLANG_PATH` if it is not on the default search path), and
# a rustc new enough for `deno_runtime` itself, which is well ahead of the
# workspace's declared floor.
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[features]
default = []
deno-host = [
    "dep:deno_runtime",
    "dep:deno_core",
    "dep:deno_resolver",
    "dep:node_resolver",
    "dep:deno_path_util",
    "dep:deno_error",
    "dep:sys_traits",
]

[dependencies]
# A target operation's files arrive base64-encoded, since a keystore is bytes
# and a module's answer crosses from its JavaScript into Rust as JSON text.
base64.workspace = true
sc-error.workspace = true
sc-log.workspace = true
# `FormField` for a module action's declared configuration, translated from v1's
# `configFields`; `Attrs` for the values; `redact_attrs`/`merge_secrets` for a
# module's own password settings (§6.2, §11.1).
sc-types.workspace = true
# `_fd_modules` is stored metadata, so this crate speaks the query language and
# reads rows back out of the driver, exactly as `_fd_llm_providers` does (§9's
# storage pattern). Needing a `Catalog` is what fixes this crate above layer 4.
sc-catalog.workspace = true
# A module's **declared tables** (TODO-imap M4) are created through the schema
# editor — the rule the admin API and an agent change a schema by — so they are
# ordinary tables. `sc-api` is already below this crate (`sc-core-actions`
# depends on it); this names the edge. `sc-files` for the local store a declared
# file field gets when none of its name exists.
sc-api.workspace = true
# The admin role a module's **service** writes at (TODO-imap M5): the module's
# own authority, over its own tables.
sc-auth.workspace = true
sc-files.workspace = true
sc-query.workspace = true
sc-db.workspace = true
# A module supplies **actions**, so it implements `sc_action::Action` and
# registers into the same `ActionRegistry` the built-ins live in — the seam that
# crate documents as the one a plugin uses.
sc-action.workspace = true
# The fifth host surface's trait (`ModuleFnHost`) lives in sc-expr, and
# `functions.rs` implements it: the seam is defined where the guest is. It is
# also where `CodeHosts` and the schema snapshot are declared — what a module's
# action is handed so that the v1 `Table` inside it can reach this server.
sc-expr.workspace = true
# The five host surfaces a module's action reaches, built from its
# `ActionContext` by `CodeSurfaces` — the very ones `run_js_code` builds, so a
# module's write carries the event's caller and this trigger's chain. The edge
# runs the way `sc-python`'s does one layer up: `sc-core-actions` is layer 9 and
# knows nothing of modules, so there is no cycle, and building the surfaces here
# a second time is exactly how the two would come to disagree about who a
# module's write is caused by.
sc-core-actions.workspace = true
# A module also supplies **model providers**, and `ModelProviderHost` — the seam
# for them — is declared in `sc-model` beside this crate at layer 6, for exactly
# the reason `TableProviderHost` is declared in `sc-catalog` below it: a trait a
# module implements has to be declared somewhere a module can see.
sc-model.workspace = true
# And a module supplies **stream providers** (TODO "Streams" §12), whose
# `StreamProviderHost` seam is declared in `sc-stream` beside this crate at
# layer 6 — the `sc-model` edge again, for the `sc-model` reason. What a module
# supplies is a *poll*, so what is registered is `sc_stream::PollingProvider`
# wrapping the calls below: there is no channel from a Deno worker back into the
# host, and the loop belongs where it is written once.
sc-stream.workspace = true
# And a module supplies **application frameworks** (§13.3), whose `FrameworkHost`
# seam is declared in `sc-app` for the same reason again: a trait a module
# implements has to be declared somewhere a module can see. `sc-app` depends on
# neither this crate nor `sc-core-actions`, so the edge is acyclic — it is the
# same shape as the one to `sc-model`, one layer higher.
sc-app.workspace = true
# And Saltcorn UI's **view runtime** (TODO "Saltcorn UI" §3): `sc-viewpattern`
# declares the render seam, and this crate implements it over the worker a v1
# view pattern runs on — the `sc-app` shape again, one layer higher still.
sc-viewpattern.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
# The installer runs `npm`, which is a child process: awaited without blocking a
# runtime thread, its stdio piped. `sync` carries the in-flight call map's
# oneshots — the host itself is no longer a process.
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt"] }
# `FuturesUnordered`: a module call may have several asks in flight at once — a
# `Promise.all` of two reads — and the caller that serves them is holding
# borrowed hosts, so they cannot be spawned onto the runtime.
futures.workspace = true

# `deno-host` only. The four wirings of the in-process runtime: the worker and
# its node compatibility layer, the byonm resolver over the modules root's own
# `node_modules`, and the `sys_traits`/`deno_error` types those two trade in.
deno_runtime = { workspace = true, optional = true }
deno_core = { workspace = true, optional = true }
deno_resolver = { workspace = true, optional = true }
node_resolver = { workspace = true, optional = true }
deno_path_util = { workspace = true, optional = true }
deno_error = { workspace = true, optional = true }
sys_traits = { workspace = true, optional = true }

# `deno-host` only, and the reason the module runtime is portable at all: this
# builds the V8 startup snapshot the worker starts from, so that the extension
# JavaScript `deno_core` would otherwise read from the *build machine's* cargo
# registry at every worker start is carried inside the binary. See `build.rs`.
#
# It is the same package as the dependency above — `dep:deno_runtime` turns on
# both — with `snapshot` added. Cargo's v3 resolver does not unify
# build-dependency features with ordinary ones, so this is a second compilation
# of the deno tree: the price of a snapshot, and what Deno's own build pays.
[build-dependencies]
deno_runtime = { version = "0.263", features = [
    "snapshot",
    "transpile",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `eval` for the tests alone: `tests/two_pools.rs` has to build one of
# `sc_expr`'s bare isolates to assert that a module worker can still start
# afterwards, which is the ordering the whole process depends on.
sc-expr = { workspace = true, features = ["eval"] }
sc-db.workspace = true
sc-db-postgres.workspace = true
# The file store a scaffolded application's project is written into, for the
# bundled Vue module's end-to-end test.
sc-files.workspace = true
sc-test-harness.workspace = true
# `sc-stream::testing`'s `Collector` — the `Vec` a stream's elements are
# asserted against, which is exactly what a seam test wants and what the
# feature exists to let another crate reach.
sc-stream = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
