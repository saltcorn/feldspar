[package]
name = "sc-auth"
description = "User, Role, sessions, authentication (layer 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
sc-query.workspace = true
sc-db.workspace = true
sc-catalog.workspace = true
sc-types.workspace = true
# `value_from_json`, for reading a caller back out of the JSON an event carries
# it as. The workspace dep defaults `sc-expr`'s features off, so no engine is
# linked here — the parser and the two value conversions are all that is used.
sc-expr.workspace = true
argon2.workspace = true
bcrypt.workspace = true
sha2.workspace = true
# Two-factor authentication: TOTP codes (RFC 6238), the secret in base32, and
# the QR code an authenticator app scans.
hmac.workspace = true
sha1.workspace = true
data-encoding.workspace = true
qrcode.workspace = true
# The base64url of an API token's random bytes (§13.6).
base64.workspace = true
lru.workspace = true
chrono.workspace = true
serde.workspace = true
uuid.workspace = true
# The `_fd_roles` attributes column (role-specific settings, §9).
serde_json.workspace = true
# LLM credits are exact (`numeric`): a balance summed from many small debits
# must not drift (TODO-payments P6).
rust_decimal.workspace = true
# A ledger write's table event that could not be dispatched is said in the log.
sc-log.workspace = true
# One first use at a time creates the role grants or the credits ledger.
tokio = { workspace = true }

[features]
# `SessionStore::login` and friends, and `SecondFactorWaiver::Test`: a test's
# session without a sign-in. Enabled only by dev-dependencies (a workspace
# invariant test checks that no ordinary dependency does), so a server cannot
# start a session except from a `FullyAuthenticated` (security review 2026-11,
# §2).
testing = []

[dev-dependencies]
# This crate's own integration tests sign in with `testing`.
sc-auth = { path = ".", features = ["testing"] }
sc-db-postgres.workspace = true
sc-test-harness = { workspace = true, features = ["catalog"] }
tokio = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
