[package]
name = "sc-db-postgres"
description = "Postgres DatabaseDriver implementation (layer 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
sc-log.workspace = true
sc-query.workspace = true
sc-db.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
# Backing types for the wire-level `Value` ⇆ Postgres mapping.
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
# Named only in the `ToSql` method signatures the param wrapper implements.
bytes.workspace = true
# pgvector's `halfvec` elements.
half.workspace = true

[dev-dependencies]
sc-test-harness.workspace = true
# The SQL echo is asserted from the capture sink rather than from stdout (§16).
sc-log = { workspace = true, features = ["capture"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
