[package]
name = "sc-stan"
description = "Bayesian models with Stan: the program parser, stanc, CmdStan and the provider (layer 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate, as everywhere in the workspace.
autotests = false

[dependencies]
sc-error.workspace = true
# The seam this crate implements: `ModelProvider`, and the `Interface` the
# program parser produces for the host's binder (TODO §4).
sc-model.workspace = true
# The program lives in a file store and nowhere else (TODO §6).
sc-files.workspace = true
# `FormField`/`Attrs`: the provider's configuration, declared the way every
# configurable extension point declares its settings.
sc-types.workspace = true
# The file-store pick-list's server-query name, `QUERY_FILE_STORES`.
sc-catalog.workspace = true
async-trait.workspace = true
serde.workspace = true
# Every file of a program is hashed, so an instance can say "the program has
# changed since this fit" (TODO §6).
sha2.workspace = true
# `make build` is a subprocess awaited without blocking a runtime thread, and
# the download is written to disk as it arrives.
tokio = { workspace = true, features = ["fs", "process", "time", "sync", "macros", "io-util"] }
# The release tarball and the "latest release" lookup, over the workspace's one
# rustls reqwest.
reqwest.workspace = true
serde_json.workspace = true
# Killing `make`'s whole process group when an install is abandoned: `make -jJ`
# is a tree of compilers, and killing `make` alone leaves them writing into the
# directory being removed.
libc.workspace = true
# The chains of a fit are futures run together, and the first failure drops
# (and so kills) the rest.
futures.workspace = true
# A raw run is published to a file store as bytes, its CSVs gzipped.
bytes.workspace = true
flate2.workspace = true
# A fit with no instance to name its run after gets a fresh id, and a fit with
# no seed configured gets a fresh one.
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
