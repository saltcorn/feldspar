[package]
name = "sc-model"
description = "Predictive models: the dataset, the frame, the split and the provider seam (layer 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*.
autotests = false

# The machine-learning built-ins are a **feature**, and it is on by default so
# that `--no-default-features` is the opt-out rather than something a packager
# has to remember (TODO §13). GOALS asks for the flag directly: "the core rust
# code supplies model providers for regression, classification, clustering and
# dimensionality reduction based on smartcore. this needs to be a cargo feature
# flag so it can be disabled."
#
# What survives the opt-out is `t_test` and `anova`: they are arithmetic over a
# distribution function, not machine learning, and a build with no smartcore
# should still be able to answer whether two groups differ. A registry holding
# only those two is a real state and not an empty list — see
# `BUILTINS_COMPILED_OUT`.
[features]
default = ["smartcore"]
smartcore = ["dep:smartcore"]

[dependencies]
sc-error.workspace = true
# `FormField` for a provider's declared configuration and `Attrs` for the values
# — the one vocabulary every configurable extension point speaks (§6.2). Phase 1
# uses it only for the column-type vocabulary a later phase's `config_spec` is
# handed; the trait itself lands in Phase 2.
sc-types.workspace = true
# The formula language a dataset column *is* (§2): one `Formula` per column,
# validated against the same `SchemaShape` and translated by the same
# `translate_value` a calculated field goes through. The `eval` feature is
# deliberately not enabled — this crate parses and translates, it does not run
# an engine.
sc-expr.workspace = true
# Named datasets (analytics TODO A1.8): a model's dataset is a reference to one,
# resolved and read through the compiler there.
sc-dataset.workspace = true
# A dataset becomes a `Select`: the projections and the filter this crate builds
# are handed to the row layer, which is what actually reads (see `DatasetSource`).
sc-query.workspace = true
# The split's hash (§5). A *stable* hash, on purpose: `DefaultHasher` is
# explicitly not stable across Rust releases, and an instance whose train/test
# assignment moved under a toolchain upgrade would make two instances of one
# model incomparable — which is the whole reason the split is a hash.
sha2.workspace = true
# `_fd_models` and `_fd_model_instances` are stored metadata, so this crate
# speaks the query language, reads rows back out of the driver and bootstraps
# its two tables through the catalog (§9's storage pattern, as `_fd_triggers`
# and `_fd_agents` do). The catalog is also what fixes the crate above layer 4.
sc-catalog.workspace = true
sc-db.workspace = true
uuid.workspace = true
# An instance records when its fit was started: UTC, no timezone database, as
# everywhere else.
chrono.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# The five machine-learning built-ins (§13), behind the feature above. The
# library supplies the estimators; the standard errors, the odds ratios, the
# feature importances and every metric are this crate's, because they are what
# makes a fitted model readable and smartcore does not give them.
smartcore = { workspace = true, optional = true }
# Student's *t* and Fisher–Snedecor's *F*, for `t_test`, `anova` and a
# regression coefficient's *p*. Not optional: see the feature comment above.
statrs.workspace = true
# The symmetric eigendecomposition behind `icar_scale`, BYM2's scaling factor
# (Stan TODO §12). Not behind the `smartcore` feature: binding is the host's,
# whichever providers are compiled in.
nalgebra.workspace = true
# A model's view state is patched key by key (analytics TODO A3.4); the
# patches of one process are applied one at a time, behind an async mutex.
tokio = { workspace = true }

[dev-dependencies]
# The dataset's `Select` is asserted as rendered SQL rather than as a tree: the
# question a test asks is "did the filter fold into the WHERE", and the answer
# reads as SQL. The stores are pinned against a real Postgres (principle 4),
# because what a save writes and a load reads back is the whole of whether a
# configured model survives a restart.
sc-db-postgres.workspace = true
# `_fd_model_draws` is written in the transaction that marks an instance fitted,
# and whether that is atomic is a property of the backend's transactions — so
# the draws store is pinned on SQLite as well as Postgres.
sc-db-sqlite.workspace = true
sc-test-harness.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
