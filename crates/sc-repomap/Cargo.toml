[package]
name = "sc-repomap"
description = "The repo map: tree-sitter tags, a personalised PageRank over them, and a rendering fitted to a token budget (layer 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Content hashes, for the tag cache.
sha2.workspace = true
# Tree-sitter and its grammars compile C. They are a crate of their own so that
# nothing else depending on `sc-agent-builtins` rebuilds them, and they sit behind
# `grammars` so a build can leave them out: every file is then a filename entry.
tree-sitter = { workspace = true, optional = true }
tree-sitter-tags = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }

[features]
default = ["grammars"]
grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-tags",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
]

[lints]
workspace = true
