[package]
name = "sc-files"
description = "FileStore trait and local-directory driver with xattr metadata (layer 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sc-error.workspace = true
# `git` and `ssh-keygen` for the git backend, started the one way (H4).
sc-proc.workspace = true
# `Attrs` for a store definition's backend settings, so a backend's settings use
# the same vocabulary every other configurable extension point does (§6.2).
sc-types.workspace = true
async-trait.workspace = true
bytes.workspace = true
# `read_chunks`: a reader as a stream of body chunks (a served file, an upload).
futures.workspace = true
# One job: turning a file's modification time into the RFC 3339 a `stat` reports.
# Doing it by hand would be a civil-calendar conversion written out for a field
# that already has one right answer in the workspace.
chrono.workspace = true
# The store-side search (§11.3): a find-in-files pattern is a regular expression
# — or a literal escaped into one — and `regex-lite` is the engine already in the
# tree for the `String` type's `regex` attribute. Correct matching is what a
# search needs; the full crate's SIMD machinery is not.
regex-lite.workspace = true
# Extension → MIME mapping for a `File` field's MIME allow-list (§3.5).
mime_guess.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
# `process` drives the git backend: `git` and `ssh-keygen` are external
# processes, awaited without blocking a runtime thread (the same reason a code
# framework's build step needs it, §13.3).
tokio = { workspace = true, features = ["fs", "rt", "process", "io-util"] }
# Cross-platform extended-attribute access (technical design §9/§14.1): POSIX
# xattrs (`user.` namespace) on Linux/macOS/FreeBSD/NetBSD/Android via the
# mature `xattr` crate, and NTFS Alternate Data Streams on Windows. This is the
# only maintained crate covering every platform the MVP targets; `xattr` alone
# has no Windows support.
fsquirrel = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt", "macros", "net", "sync", "io-util"] }
# An HTTP remote's `Authorization` header, decoded by the token test.
base64.workspace = true

[lints]
workspace = true
