[package]
name = "sc-api"
description = "ApiProvider trait and REST provider (layer 8)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
sc-catalog.workspace = true
# Ownership-formula enforcement (§7.3, Phase 5). Without the `eval` feature:
# this crate translates formulas and holds an `Arc<dyn JsEvaluator>` seam; the
# V8 engine behind it is constructed by the server and injected.
sc-expr.workspace = true
sc-auth.workspace = true
# The negotiated locale a request is served in, carried on the admin handler
# context and on an application request (§16.x, D8).
sc-i18n.workspace = true
# An application exposes a subset of the server's triggers as endpoints (§10.2,
# §13.4): this crate projects them and runs them through the dispatcher. The
# layering is the one `sc-action`'s own docs state — it is layer 6, this is layer
# 7, and nothing below it may name a trigger.
sc-action.workspace = true
# An application's invitation and forgotten-password endpoints send their links
# by email, through the same `Mailer` a `send_email` action uses (§18.2).
sc-email.workspace = true
# The row layer (`rows`) executes table CRUD for every API surface, so it speaks
# the query language and the type system directly.
sc-db.workspace = true
sc-query.workspace = true
sc-types.workspace = true
# A `File` field's write is validated against its store/folder/MIME rules (§3.5);
# the store-independent half of that check lives in `sc-files`. The REST provider
# also serves and accepts a `File` field's bytes (§4), which is what `bytes` is
# for: it is the body type the `FileStore` trait itself speaks.
sc-files.workspace = true
# `ToolSpec`: what the administrative tool surface (§13.6) offers a model. The
# MCP `Tool` and the LLM `ToolSpec` are the same value with two spellings, so
# `mcp` produces the one and the transport renames it — rather than defining a
# third shape here for the two callers to convert between.
sc-llm.workspace = true
# A code body's `models` (Stan TODO §17): a fitted posterior's draws and
# summary, read through the `db` host. `sc-model` is layer 6, below this crate.
sc-model.workspace = true
sc-dataset.workspace = true
bytes.workspace = true
# A table's rows in and out as CSV (`csv` module): the one bulk shape an admin
# already has a tool for. See the workspace pin for why the format is not
# hand-rolled.
csv.workspace = true
# The GraphQL provider's schema, parser, validator and executor (§13.4). Built
# through `async_graphql::dynamic`, because an application's schema is its
# tables and those change at runtime; see the workspace pin for the decision.
async-graphql.workspace = true
# A `bytea` column crosses the GraphQL wire as the `Bytes` scalar, which its own
# description defines as base64 text — a JSON array of byte numbers would be
# neither that nor usable by a client.
base64.workspace = true
# The GraphQL child-list `DataLoader` dispatches its batch from a spawned task,
# so this crate needs a spawner. Only `rt` — the runtime itself is the server's.
tokio = { workspace = true, features = ["rt"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# `convert` bridges JSON to the temporal/decimal/uuid `Value` variants.
chrono.workspace = true
rust_decimal.workspace = true
uuid.workspace = true

[dev-dependencies]
# The SQLite backend, for the tests that run the row layer against a database
# that is not Postgres — which is what having a `DatabaseDriver` trait is for.
sc-db-sqlite.workspace = true
sc-db-postgres.workspace = true
sc-test-harness.workspace = true
# The real engines, for the two things a mock would hide: an ownership formula
# the translator refuses is decided by V8 (`DenoEvaluator`), and a delegated read
# from a code body must not deadlock against it (`CodeRuntime`) — see
# `tests/code_host_as_user.rs`.
sc-expr = { workspace = true, features = ["eval"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
