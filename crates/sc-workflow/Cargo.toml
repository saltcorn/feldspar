[package]
name = "sc-workflow"
description = "Durable workflows: the program a trigger body can be, its versions, and the runs of it (layer 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
# `FormField` for a `UserForm` step's declared fields and `Attrs` for an action
# step's settings — the "settings as data" vocabulary every configurable
# extension point in the tree speaks (§6.2).
sc-types.workspace = true
# `_fd_workflow_versions` and `_fd_run_traces` are stored metadata, so this crate
# speaks the query language and reads rows back out of the driver, exactly as
# `_fd_triggers` does.
sc-catalog.workspace = true
sc-query.workspace = true
sc-db.workspace = true
# The formula language a `Set` value, a `Branch` arm, a `ForEach` collection and
# a `Wait` deadline are written in — and `Ambient::Context`, which is the one
# thing a workflow adds to the scope an action already has (decision 8).
sc-expr.workspace = true
# The trigger a workflow is the **body** of: its record, its event, the scope its
# formulas are read in (`action_shape`), the registry a step's action resolves
# through, and the `WorkflowEngine` seam the engine will install itself into
# once there is an engine (§10.3, phase 3). Layer 6.
sc-action.workspace = true
# `_fd_runs` is one table for both engines (§11.4): a chat session and a durable
# workflow run are the same problem — a context written after every step and read
# back to carry on — so the run record, its storage and its states are
# `sc-agent`'s and this crate is the second engine over them, not a second table.
sc-agent.workspace = true
# What a run costs and where it stopped, said once (§16).
sc-log.workspace = true
async-trait.workspace = true
# The engine is one task: the queue's poll, the lease renewal and the shutdown.
tokio = { workspace = true, features = ["time", "rt", "macros"] }
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
# The reified evaluator a step's formulas are actually run through, so the
# driver's tests exercise the isolate rather than a stand-in for it.
sc-expr = { workspace = true, features = ["eval"] }
# The **row layer**, for the step-transaction tests only: what a step's action
# writes has to be written the way a real action writes it — through `rows`, with
# the executor the step's transaction gives it — or the test would be asserting
# about a statement no action makes. A dev-only edge, and dev edges are not part
# of the layering (see `repo_hygiene`).
sc-api.workspace = true
sc-auth.workspace = true
sc-db-postgres.workspace = true
# The live hub and a `table_changes` stream, for "a step's write is announced
# after its commit, and never if it rolls back" (TODO.md "Live updates" L3.1).
sc-live.workspace = true
sc-stream.workspace = true
sc-test-harness.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
