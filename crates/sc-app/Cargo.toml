[package]
name = "sc-app"
description = "Application model, Framework trait, routing (layer 8)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
sc-query.workspace = true
sc-db.workspace = true
sc-types.workspace = true
sc-catalog.workspace = true
sc-files.workspace = true
sc-api.workspace = true
# The roles a scaffolded project's documentation lists: `feldspar auth token
# --role NAME` needs a name, and a generated document that described roles
# instead of naming this installation's would send the reader to the admin UI.
sc-auth.workspace = true
# The locale a request is served in, carried on `AppRequest` rather than reached
# for (§16.x, D8).
sc-i18n.workspace = true
# An app declares the subset of triggers it exposes as API endpoints (§10.2):
# resolving those names against the live set — and running one — is the
# dispatcher's, so the wiring layer holds it.
sc-action.workspace = true
# An application exposes a subset of the server's streams (TODO "Streams" §10):
# resolving those names against the stored rows, and typing the generated
# client's subscription from the element type, needs the entity itself.
# `default-features = false` — the MQTT provider is the *server's* to link, and
# nothing here connects to a broker.
sc-stream = { path = "../sc-stream", default-features = false }
# The `JsEvaluator` seam threaded into providers (§7.3); no engine linked here.
sc-expr.workspace = true
# The build tools' own output is the only place a type error exists, so parsing
# the file/line/message out of it (`diagnostics`) is part of reporting a build.
regex-lite.workspace = true
# The key an unchanged build is skipped on (`build_cache`).
sha2.workspace = true
async-trait.workspace = true
bytes.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
# `process`: the build step spawns the bundler (design §13.3); `rt`: a
# server-rendered site resizes an image off the async threads.
tokio = { workspace = true, features = ["process", "rt"] }
# Resizing a server-rendered site's images (`server_render::images`).
image.workspace = true

[dev-dependencies]
sc-db-postgres.workspace = true
async-trait.workspace = true
sc-test-harness.workspace = true
sc-stream = { path = "../sc-stream", default-features = false, features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
