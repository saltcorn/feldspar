[package]
name = "sc-agent"
description = "Agents: the agent record, the trait extension point, the loop and its runs (layer 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
sc-log.workspace = true
# `FormField` for a trait's declared configuration and `Attrs` for the values —
# the vocabulary every configurable extension point in the tree speaks (§6.2).
sc-types.workspace = true
# `_fd_agents` and `_fd_runs` are stored metadata, so this crate speaks the query
# language and reads rows back out of the driver, exactly as `_fd_triggers` does.
# `CallerContext` also lives here, which is what a trait's tools run as.
sc-catalog.workspace = true
sc-query.workspace = true
sc-db.workspace = true
# `JsEvaluator` alone — the trait, not an engine (the workspace dep defaults
# `eval` off). A trait's tool carries it because a table whose ownership formula
# does not translate to SQL is read row by row through V8 (§7.3), and a tool that
# could not reach one would have to choose between failing and skipping the check.
sc-expr.workspace = true
# The provider seam. This crate knows agents, traits and the loop, and nothing
# about which vendor is on the other end (§11.1).
sc-llm.workspace = true
# `User`: the caller a run carries, and the identity every tool executes as
# (decision 5). Layer 5, below this one.
sc-auth.workspace = true
# The headless-browser seam `view_app` drives, re-exported from `view`.
sc-browser.workspace = true
# `TriggerDispatcher`: what a trait that runs a trigger needs (§11.3's
# `run_trigger`), carried on the context beside the evaluator for the same
# reason — it is a capability the deployment has or has not got, and a tool that
# could not reach one must say so rather than invent a second way to fire an
# event. Layer 6, below this crate; nothing here knows which triggers exist.
sc-action.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
# LLM credits (TODO-payments P6.3): a call's charge, exact as the ledger keeps it.
rust_decimal.workspace = true
# `Stream` combinators for the scripted provider's failure stream.
futures.workspace = true
# The `pattern` keyword of a tool's argument schema, checked before dispatch.
regex-lite.workspace = true

[features]
# The scripted provider the loop, the traits and the chat socket are tested
# against. A **feature**, not `#[cfg(test)]`: `sc-core-traits` and `sc-server`
# test against it too, and a fake that only exists inside this crate's own test
# build is one they cannot reach (decision 7).
testing = []

[dev-dependencies]
sc-agent = { workspace = true, features = ["testing"] }
# The loop's own log lines are asserted from the capture sink (§16).
sc-log = { workspace = true, features = ["capture"] }
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-test-harness.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
