[package]
name = "sc-core-traits"
description = "The core built-in agent traits (layer 9)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
# The extension point these implement: `AgentTrait`, `AgentRegistry`, and the
# `RunCaller` every tool executes as.
sc-agent.workspace = true
# The row layer. This is what fixes this crate *above* `sc-api`, exactly as it
# fixes `sc-core-actions` there: a trait's read goes through the same §7.3
# access rule an API caller's does, and a trait's write (Phase 3's later items)
# through the same coercion, validation and events.
sc-api.workspace = true
sc-catalog.workspace = true
# The trigger set and the dispatcher `run_trigger` runs one through — the same
# dispatcher every other event fires on, so an agent is one more thing that can
# ask rather than a second way to fire (§11.3).
sc-action.workspace = true
# `is_public`: the one definition of a public address, shared with the SMTP
# override check so the fetch guard and a trigger's mail agree on it.
sc-email.workspace = true
# `User` and the role scale a caller is checked on.
sc-auth.workspace = true
# `Expr`/`OrderBy`/`Value`: what a tool's `where` and ordering are translated
# into before they reach the row layer. A tool never composes SQL.
sc-query.workspace = true
# `JsEvaluator` alone (the workspace dep defaults `eval` off) — a reified
# ownership formula decides per row in V8, and the engine arrives on the context.
sc-expr.workspace = true
# `FormField`/`Attrs`: a trait's configuration, declared as data.
sc-types.workspace = true
# `ToolSpec`: what a trait offers the model.
sc-llm.workspace = true
# The file stores the coding traits work in (§11.3): the same `FileStore` trait
# and the same §9 access rules the file manager and the IDE go through, and the
# store-side search both they and `search_files` run.
sc-files.workspace = true
# The repo map (TODO §11): tags, ranking and rendering, over files this crate reads.
sc-repomap.workspace = true
# A repo map that cannot be built is logged, not a failed session.
sc-log.workspace = true
# The application `build_application` builds — resolved from its stored row and
# built by the same `sc_app::build_application` the admin's Build button runs, so
# there is one build path and one set of diagnostics to explain.
sc-app.workspace = true
# The MCP client the `mcp_server` trait calls a remote server through (AS9.1).
sc-mcp.workspace = true
async-trait.workspace = true
# The agent memory store (TODO-agent-skills AS8.3): its identity key column
# (`ColumnGenerator`) and the `written_at` stamp.
sc-db.workspace = true
chrono.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
# The edit engine's fuzzy step and the change ledger's diff (TODO §6).
similar.workspace = true
# The content hash a read records, so an edit can refuse a file that changed
# since (TODO §6).
sha2.workspace = true
# The test ratchet counts test blocks and skips in a test file (TODO 6.5).
regex-lite.workspace = true
# `process` spawns `npm run <script>` and `time` bounds it; a script that hangs
# must not hold a conversation open (§11.3).
tokio = { workspace = true, features = ["process", "time", "net"] }
# A unique name for each sandbox container the shell starts (TODO 6a.5).
uuid.workspace = true
# The `http` trait's client — the workspace's one reqwest, on rustls, so an
# agent's fetch shares a TLS stack with the `fetch` action and the LLM provider.
reqwest.workspace = true
# A model-written body's `fetch` answers binary bodies in base64 (AS5).
base64.workspace = true
# The `http` trait turns an HTML page into Markdown, walking the parsed tree
# first to find the page's main content (see the workspace pin).
htmd.workspace = true
markup5ever_rcdom.workspace = true
# `view_image`: decode, measure and, when too large, scale an image before it
# is shown to a model.
image.workspace = true
# The `http` trait's page cache: fetched documents, byte-bounded, least
# recently used out first.
lru.workspace = true

[target.'cfg(unix)'.dependencies]
# The coding shell's child processes (TODO 6a): a process group per command, so
# a timeout kills what the command started as well as the shell; the parent
# death signal, so a managed process does not outlive a server that was killed;
# and the merged stdout/stderr pipe.
libc.workspace = true

[dev-dependencies]
# Every trait is pinned against a real database (principle 4) and, where a table's
# ownership formula does not translate, the real V8 engine — a mock would hide
# exactly the mistakes these tests exist to catch.
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-test-harness.workspace = true
sc-expr = { workspace = true, features = ["eval"] }
# The scripted provider (`sc-agent`'s `testing` feature): a trait is exercised
# through a whole agent run, and no test in this tree may need an API key.
sc-agent = { workspace = true, features = ["testing"] }
# The built-in actions, so a trigger an agent fires — and a trigger an agent's
# own write fires — is a real one doing real work, rather than a stub that would
# prove only that the seam was called.
sc-core-actions.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
