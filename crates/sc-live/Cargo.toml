[package]
name = "sc-live"
description = "Live updates: the multiplexed socket's protocol, subscriptions, the topic index and the hub (layer 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file, as everywhere
# in this workspace.
autotests = false

[dependencies]
sc-error.workspace = true
# The role numbers a subscription is decided against (`ROLE_ADMIN`, and the
# public role an anonymous caller holds).
sc-auth.workspace = true
# What a subscription is *to*: a running stream, its envelope and its topics.
# The hub holds one receiver per running stream and fans its elements out.
sc-stream.workspace = true
# The write seam (`TableEvents`): a row topic's access is re-checked when a
# table its read rule reads is written to (§3 rule 6). And `sc-expr`'s
# `LiveHost`, the seam the `publish` action and `live.publish` reach the hub
# through, installed on the catalog.
sc-catalog.workspace = true
sc-expr.workspace = true
async-trait.workspace = true
# A retained element's freshness is judged against the wall clock, as its
# `received_at` was stamped by it.
chrono.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
# The fan-out is a task per running stream, and each connection has a bounded
# queue it is handed elements on: `mpsc`, `watch` and `Notify`, never a lock
# held across an await.
tokio = { workspace = true }

[dev-dependencies]
# The hub's own tests subscribe to a stream the scripted provider publishes on,
# through the real supervisor, exactly as `sc-server`'s socket tests do.
# Starting a stream needs no database: `StreamSupervisor::start` takes the row.
sc-stream = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The table-changes tests (L3.3) write through the **row layer** against a real
# Postgres, over a driver that counts the statements it is asked to run — the
# only way to see that an unobserved update reads no pre-image. Dev edges are
# not part of the layering (see `repo_hygiene`).
sc-api.workspace = true
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-query.workspace = true
sc-test-harness.workspace = true
sc-types.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
