[package]
name = "sc-action"
description = "Action trait, event model, run context and registry (layer 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary per crate rather than one per file: every test
# target in this workspace statically links V8, so ~400 MB of binary and a
# multi-second link were being paid per *file*. `tests/it.rs` aggregates them.
autotests = false

[dependencies]
sc-error.workspace = true
# `FormField` for an action's declared configuration and `Attrs` for the values
# — the one vocabulary every configurable extension point speaks (§6.2).
sc-types.workspace = true
# An action reads and writes rows, so it needs the catalog. This is also what
# fixes the crate at layer 6: everything above it may call in, nothing below.
sc-catalog.workspace = true
# The row-access layer: `ActionContext::scoped` hands an action a
# `sc_access::Scoped` — the catalog with the trigger's authority bound to it —
# rather than leaving the action to remember whose authority it writes under
# (TODO-code-quality Q3.4). `sc-access` sits below this crate.
sc-access.workspace = true
# The formula language an action's configuration is written in (decision 7).
# The `eval` feature is deliberately *not* enabled here: this crate holds the
# `JsEvaluator` seam, the server supplies the engine.
sc-expr.workspace = true
# The mail transport seam, for the same reason the `JsEvaluator` seam is here: an
# action that sends mail is handed one through `ActionContext`, and the crate
# that owns the context has to be able to name the trait. `sc-email` is beside
# this crate at layer 6 and depends only on layers below it, so this is not a
# cycle — it is the same shape as `sc-llm` sitting under the agent runner.
sc-email.workspace = true
async-trait.workspace = true
# One macro: `task_local!`, for the error event's re-entrancy guard (§10.2). A
# flag on the dispatcher would drop a *concurrent* unrelated error; the guard is
# about one error's own handling, which is one task's.
tokio.workspace = true
serde_json.workspace = true
# `TriggerId` is `Serialize`/`Deserialize`, and only for that: a workflow's
# stored JSON names the trigger it is the body of (§10.3), and that document is
# the API's shape and the editor's shape as well as the row's.
serde = { workspace = true }
# UTC instants: a periodic trigger's due-time arithmetic and its `last_run_at`
# (§10.2, decision 6). No timezone database — everything is UTC by decision.
chrono.workspace = true
# `_fd_triggers` is stored metadata, so this crate speaks the query language and
# reads rows back out of the driver (§9's storage pattern, as `file_stores` does).
sc-query.workspace = true
sc-db.workspace = true
uuid.workspace = true

[dev-dependencies]
# The `ActionContext` contract needs a real `Catalog`, so it is pinned against a
# real database (principle 4) rather than around a mock driver that does not exist.
sc-db.workspace = true
sc-db-postgres.workspace = true
sc-test-harness.workspace = true
tokio = { workspace = true }
# Rendering a template is the one thing in this crate that needs a real engine
# rather than the seam: the tests supply `DenoEvaluator`, as `sc-action-builtins`'
# do, because a template facility asserted against a fake evaluator would prove
# nothing about what an email actually says.
sc-expr = { workspace = true, features = ["eval"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
